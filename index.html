<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GST Bill Generator</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    <style>
      .invoice-sheet {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        padding: 12px;
      }
      .invoice-sheet .card {
        box-shadow: none;
        border: 1px solid #e3e3e3;
      }
      .hint {
        font-size: 0.8rem;
        color: #6c757d;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          background: #fff !important;
        }
        .container-fluid {
          max-width: 100% !important;
          padding: 0 !important;
          margin: 0 !important;
        }
        .row {
          margin: 0 !important;
        }
        .invoice-col {
          flex: 0 0 100% !important;
          max-width: 100% !important;
          padding: 0 !important;
        }
        .invoice-sheet {
          padding: 0 !important;
          box-shadow: none !important;
          border-radius: 0 !important;
        }
        /* Chrome strips background colors when exporting PDF; keep zebra
           striping and any filled/muted areas visible in the output. */
        .invoice-sheet,
        .invoice-sheet .table-striped tbody tr:nth-of-type(odd),
        .invoice-sheet .table-active {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        /* Compact, invoice-like typography (print only; screen unchanged). */
        .invoice-sheet {
          font-size: 14px;
        }
        .invoice-sheet .card-header {
          padding: 0.5rem 1.25rem;
        }
        .invoice-sheet .card-body {
          padding: 1rem 1.25rem;
        }
        .invoice-sheet .table th,
        .invoice-sheet .table td {
          padding: 0.3rem 0.5rem;
        }
        /* Clean page breaks: repeat the column header on each page and never
           split a row or a table block in half. */
        .invoice-sheet table thead {
          display: table-header-group;
        }
        .invoice-sheet tr {
          break-inside: avoid;
          page-break-inside: avoid;
        }
        .invoice-sheet .table-responsive-sm {
          overflow: visible !important;
          break-inside: avoid;
          page-break-inside: avoid;
        }
        @page {
          size: A4;
          margin: 12mm;
        }
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- The whole app (Leptos CSR) mounts here. -->
  </body>
</html>
