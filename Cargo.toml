[package]
name = "gst-bill"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "GST tax invoice generator — fully client-side (CSR) Leptos web app compiled to WASM"
license = "MIT"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Storage",
    "Event",
    "console",
] }
